name: Docker CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t predictive-maintenance-api .

      - name: Run container
        run: docker run -d --name app -p 8000:8000 predictive-maintenance-api

      - name: Test health
        run: |
          sleep 5
          curl -f http://127.0.0.1:8000/health
      - name: Test prediction
        run: |
          curl -f -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "air_temperature": 298.5,
              "process_temperature": 309.2,
              "rotational_speed": 1420,
              "torque": 55.3,
              "tool_wear": 190,
              "product_type": "M"
            }'

      - name: Cleanup
        if: always()
        run: docker rm -f app || true